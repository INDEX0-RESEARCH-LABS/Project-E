# Conservative scenario: every uncertain parameter moved toward the unfavourable end.
# These are bounds used for stress testing, not predictions.
meta:
  name: conservative
  description: "Pessimistic component performance and cost; physics unchanged."

assumptions:
  packaging_factor:
    value: 1.40
    source: "scenario: conservative packaging allowance"
    evidence: E1
  degradation_margin:
    value: 0.30
    source: "scenario: conservative end-of-life margin"
    evidence: E1
  missions_per_year:
    value: 200.0
    source: "scenario: conservative utilisation"
    evidence: E0
  electricity_usd_per_kwh:
    value: 0.30
    source: "scenario: remote-site electricity price"
    evidence: E0
  h_convection_w_m2k:
    value: 5.0
    source: "scenario: poor natural convection"
    evidence: E1
  ambient_c:
    value: 40.0
    source: "scenario: hot-climate ambient (45 C makes the 45 C battery coolant infeasible; see OPEN_QUESTIONS)"
    evidence: E1

battery:
  specific_energy_wh_kg:
