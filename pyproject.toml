[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-e"
version = "0.1.0"
description = "Reduced-order energy system models for Project E"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.11", "pyyaml>=6.0", "matplotlib>=3.8"]

[project.scripts]
project-e = "project_e.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
